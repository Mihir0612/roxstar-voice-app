org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Backend endpoint.
#
# The release build MUST NOT point at localhost -- an APK that can only talk to
# a developer machine is a failed submission. `verifyReleaseEndpoint` in
# app/build.gradle.kts fails the release build if this is still a loopback
# address, so the mistake cannot ship silently.
#
# After deploying, set this to the Cloud Run URL, for example:
#   ROXSTAR_API_BASE_URL=https://roxstar-backend-abc123-ew.a.run.app
#
# 10.0.2.2 is the host machine as seen from the Android emulator.
# ---------------------------------------------------------------------------
ROXSTAR_API_BASE_URL_DEBUG=http://10.0.2.2:8080
ROXSTAR_API_BASE_URL=https://REPLACE-WITH-YOUR-CLOUD-RUN-URL.run.app
